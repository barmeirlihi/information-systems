<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - FlyTau</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="centered-page">
    <div class="card card-extra-round">
        <div class="header-section">
            <div class="icon-circle" style="background-color: #fee2e2; color: #991b1b;">
                ⚠️
            </div>
            <h2 style="font-weight: 900; font-size: 1.875rem; color: #991b1b;">Error</h2>
        </div>

        <div class="error-msg" style="border-left: 4px solid #780000; text-align: left; font-weight: bold; background-color: #fef2f2; color: #b91c1c; padding: 1rem;">
            {{ error }}
        </div>

        <div style="margin-top: 2rem; text-align: center;">
            <a href="/" class="link-primary">Back to Homepage</a>
        </div>
    </div>
</body>
</html>
