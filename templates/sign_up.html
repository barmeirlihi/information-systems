<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Registration - FlyTau</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="centered-page">
    {% if session.get('user_type') %}
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <a href="/logout" style="background-color: #ef4444; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; text-decoration: none; font-weight: bold; font-size: 0.875rem;">
            Logout
        </a>
    </div>
    {% endif %}

    <div class="card card-wide theme-emerald">

        <div class="header-section">
            <div class="icon-circle">📝</div>
            <h2>Member Registration</h2>
            <p>Sign up for exclusive rewards and faster booking.</p>
        </div>

        {% if message %}
            <div class="error-msg">{{ message }}</div>
        {% endif %}

        <form action="/sign_up" method="POST" class="form-grid">

            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" placeholder="First Name" required>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" placeholder="Last Name" required>
            </div>

            <div class="form-group col-span-2">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="email@example.com" required>
            </div>

            <div class="form-group col-span-2">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Birth Date</label>
                <input type="date" name="birth_date" required>
            </div>

            <div class="form-group">
                <label>Passport Number</label>
                <input type="text" name="passport_number" placeholder="Passport ID" required>
            </div>

            <div class="form-group col-span-2">
                <label>Phone Numbers</label>
                <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 5px;">Separate multiple numbers with a comma</div>
                <input type="text" name="phone_numbers" placeholder="050-1234567, 052-7654321">
            </div>

            <div class="col-span-2" style="margin-top: 1rem;">
                <button type="submit" class="btn btn-success">
                    Register Account
                </button>
            </div>

        </form>

        <div style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: #64748b;">
            Already a member? <a href="/login" style="color: #2563eb; text-decoration: none; font-weight: bold;">Sign In</a>
        </div>
    </div>

</body>
</html>
