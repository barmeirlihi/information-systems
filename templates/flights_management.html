<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול טיסות - FlyTau</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="centered-page">

    {% if session.get('user_type') %}
    <div style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
        <a href="/logout" style="background-color: #ef4444; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; text-decoration: none; font-weight: bold; font-size: 0.875rem;">
            logout
        </a>
    </div>
    {% endif %}

    <div class="card" style="max-width: 800px;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div class="icon-circle" style="background-color: #f1f5f9;">✈️</div>
            <h2 style="font-weight: 900; font-size: 1.8rem; letter-spacing: -1px; text-transform: uppercase;">ניהול טיסות</h2>
            <p style="font-size: 0.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; color: #94a3b8;">
                Flight Management System
            </p>
        </div>

        <div style="text-align: center; margin-top: 2.5rem;">
            <a href="/" style="font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; color: #94a3b8; text-decoration: none;">
                &larr; חזרה לדף הבית
            </a>
        </div>
    </div>

</body>
</html>
